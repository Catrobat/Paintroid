// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://plugins.gradle.org/m2/") }
        maven { url = uri("https://jitpack.io") }
    }
    dependencies {
        classpath 'com.github.Catrobat:Gradle:1.6.2'
    }
}

plugins {
    id "com.android.application" version '8.13.0' apply false
    id "com.android.library"     version '8.13.0' apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
    id "io.gitlab.arturbosch.detekt" version "1.23.6" apply false
    id "com.getkeepsafe.dexcount"     version "4.0.0" apply false
}

ext {
    androidCompileSdkVersion = 35
    androidTargetSdkVersion = 35
    androidMinSdkVersion = 21

    androidSupportLibraryVersion = '28.0.0'

    androidVersionCode = 53
    androidVersionName = '2.13.0'
}

if(project.hasProperty("snapshot")) {
    androidVersionName = '-LOCAL'
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}
